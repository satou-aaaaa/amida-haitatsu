<style>
/* 町の地図：淡い若葉色の地に生成りの紙。足した横線は朱色、はじめからの道は墨色、工事中はだいだい */
:root{
  --bg:#e3ece6; --paper:#fffdf7; --ink:#26323a; --ink2:#5f6f78; --line:#26323a22;
  --land:#f6f0e1; --edge:#8a8170; --sea:#cfe1ea; --route:#d2492f; --route2:#9b3220; --go:#2f8a5b; --goal:#d2492f; --nb:#ffe7a3; --gold:#d79b2c;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-weight:800;font-size:21px;margin:0;letter-spacing:.04em}
h1 small{font-size:12px;letter-spacing:0;color:var(--ink2);margin-left:8px;font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);box-sizing:border-box;padding:0 8px;background:var(--paper)}
.icon:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.dots{display:flex;gap:6px;flex:1;max-width:120px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--route)}.dots i.done{background:var(--ink)}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--route);color:#fff;font-weight:800;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 var(--route2)}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--route2)}
button.main.alt{background:#2f5d7a;box-shadow:0 4px 0 #1d3d52}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a{color:var(--route2);display:inline-flex;align-items:center;min-height:44px}
/* あみだの盤 */
.ask{text-align:center;font-size:14px;font-weight:800;margin:0;color:var(--ink2)}
.board{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 0 #26323a14;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.board svg{display:block;width:100%;height:auto}
.board .hit{fill:transparent;cursor:pointer}
.board .hit:focus-visible{outline:none;fill:#d2492f22}
.board.win .add{stroke:var(--go)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-height:22px}
.verdict{background:var(--paper);border:2px solid #2f5d7a;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #26323a1c;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.verdict .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:22px;font-weight:800}
.stars{color:var(--gold);letter-spacing:.1em;font-size:20px}
.stars .off{color:#26323a26}
/* ホーム */
.title{font-weight:800;font-size:36px;letter-spacing:.06em;text-align:center;margin:4px 0 0}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.rank{text-align:center;font-size:13px;color:var(--route2)}
.share{background:var(--paper);border-radius:14px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:800;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.big{font-weight:800;font-size:24px;text-align:center;margin:0}
.res{display:flex;flex-direction:column;gap:6px}
.res div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* 配達帳 */
.dex{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.dex div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:13px;min-height:44px;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box}
.dex div small{font-size:11px;color:var(--ink2)}
.dex .no,.res .no{opacity:.45}
dialog{border:none;border-radius:18px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px;letter-spacing:.06em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--route2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
.achs{display:flex;flex-direction:column;gap:8px}
.achs div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.achs div.got{border-color:var(--gold);background:#fffaf0}
.achs b{font-size:15px}.achs div.got b{color:#9a6b12}
.achs small{font-size:12px;color:var(--ink2)}
.achs i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--go) var(--p),var(--line) var(--p))}
.newach{border:1px solid var(--gold);background:#fffaf0;font-weight:800;border-radius:14px;padding:12px;text-align:center;font-size:15px;line-height:1.6}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap" id="app"></div>
<dialog id="howto" aria-labelledby="howto-t">
  <h2 id="howto-t">遊び方</h2>
  <ol>
    <li>上の手紙は、縦の道を下へ進み、横線があれば必ず渡ります（あみだくじ）。</li>
    <li>縦の道のあいだを押すと横線を引けます。もう一度押すと消せます。</li>
    <li>全部の手紙が同じ字の家に着いたら「配達する」。</li>
  </ol>
  <p>いちばん少ない本数で届けてヒントも使わなければ★3つ。いちばん少ない本数は問題の上に出ています。</p>
  <p>横線はとなり合わせに引けません。はじめからある横線（墨色）は消せず、工事中（だいだい）の所には引けません。</p>
  <p>手紙の字を押すと、その手紙の道が太くなります。今日の3問はだれでも同じで1日1回。時間制限はありません。</p>
  <p><a id="fb2" target="_blank" rel="noopener">感想を送る</a></p>
  <button class="main" id="howto-ok" style="width:100%">わかった</button>
</dialog>
<script src="gen.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/amida-haitatsu/";
const FEEDBACK = "https://github.com/satou-aaaaa/amida-haitatsu/issues/new?template=feedback.yml";
const KEY = "amida-haitatsu-v1", EPOCH = "2026-11-05";
const T = window.AMI, LVS = [...T.SIZES, T.HARD];
const COLORS = ["#d2492f", "#2f6fb0", "#2f8a5b", "#9b4fb0", "#c98a12", "#1f8f99", "#b0446f"];

// ---- 日付と種（日本時間。だれでも同じ3問）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
// 今日の3問：小道（4本）・町（5本）・大通り（6本）。上級：7本の道を2つ（ヒントなし）
const dailyList = (k) => [0, 1, 2].map((lv) => ({ lv, seed: T.seedOf(k + ":d:" + lv) }));
const hardList = (k) => [0, 1].map((j) => ({ lv: 3, seed: T.seedOf(k + ":h:" + j) }));
const cache = new Map();
const probOf = (it) => { const id = it.lv + ":" + it.seed; if (!cache.has(id)) cache.set(id, T.make(it.seed, LVS[it.lv])); return cache.get(id); };
// ★：いちばん少ない本数で3、2本多いまで2、それより多いと1。ヒント1回ごとに1つ減らす（最低1）
const starsOf = (r) => Math.max(1, (r.m === 0 ? 3 : r.m <= 2 ? 2 : 1) - (r.h || 0));
const starStr = (s) => `<span class="stars" aria-label="星${s}つ">${"★".repeat(s)}<span class="off">${"★".repeat(3 - s)}</span></span>`;

// ---- 記録（この端末の localStorage だけ）----
// 進行中の遊びはモードごとに分けて持つ（練習を始めても今日・上級の途中経過を消さない）。cnt・perf：大きさごとの配達した数・いちばん少ない本数で届けた数
const fresh = () => ({ v: 1, days: {}, hdays: {}, cnt: {}, perf: {}, total: 0, runs: {}, tut: false, kofi: {}, ach: {} });
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
// 保存に失敗したあとはメモリと保存の両方を読む。記録（日ごとの結果・配達帳）は合わせて数は高いほう、途中経過は同じ日・同じ問題なら進んだほう
const doneOf = (r) => !!r && r.res.length >= r.list.length, recOf = (r) => ({ r: r.res.map((x) => ({ m: x.m, h: x.h })) });
// 終わった今日・上級の回を日ごとの記録に入れる（結果を見る前に別のタブが次の日を保存しても、終えた日を失わない）
function bank(s, r) { const b = doneOf(r) ? (r.mode === "d" ? s.days : r.mode === "h" ? s.hdays : null) : null; if (!b || b[r.date]) return false; b[r.date] = recOf(r); return true; }
function load() { let a = null, b = null; try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {} if (a && a.v !== 1) a = null; if (b && b.v !== 1) b = null; if (!a || !b) return Object.assign(fresh(), a || b || {}); const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a]; const s = Object.assign(fresh(), n); for (const k in o) { if (k === "runs" || k === "t") continue; const x = o[k], y = n[k]; if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); } else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y); else if (x === true) s[k] = true; } const ra = a.runs || {}, rb = b.runs || {}, prog = (r) => (r.res ? r.res.length : 0) * 1e6 + (r.cur && r.cur.moves ? r.cur.moves : 0), idOf = (r) => JSON.stringify([r.list || null, r.id || null]); s.runs = Object.assign({}, n.runs); for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) { const x = ra[m], y = rb[m]; if (x === undefined || y === undefined) { if (x || y) s.runs[m] = x || y; continue; } if (!x || !y) { const r = x || y; if (!r || bank(s, r) || doneOf(r)) continue; const bd = r.mode === "d" ? s.days : r.mode === "h" ? s.hdays : null; if (bd && !bd[r.date]) s.runs[m] = r; continue; } if (x.date !== y.date) { const [w, l] = x.date > y.date ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; } else if (idOf(x) === idOf(y)) { const px = prog(x), py = prog(y); s.runs[m] = px > py ? x : py > px ? y : n.runs[m]; } } return s; }
// 保存の前に読み直す（別のタブで進めた記録を消さない）
function save(fn) { const s = load(); fn(s); s.t = Math.max(Date.now(), (s.t || 0) + 1); const j = JSON.stringify(s); try { localStorage.setItem(KEY, j); mem = null; } catch (e) { mem = j; } return s; }
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
function streak(days) { let k = todayKey(), n = 0; if (!days[k]) k = prevDay(k); while (days[k]) { n++; k = prevDay(k); } return n; }
const RANKS = [[0, "見習い配達員"], [10, "町の配達員"], [40, "ベテラン配達員"], [120, "配達名人"], [300, "伝説の配達員"]];
const rankOf = (n) => RANKS.filter((r) => n >= r[0]).pop()[1];
const nextRank = (n) => RANKS.find((r) => r[0] > n);
// 実績：腕前（ぴったり・ヒントなし・上級）は今日の3問と上級の記録だけで数え、練習は配達帳の数にだけ入る
const one = (r) => r.m === 0 && !r.h;
function maxStreak(days) { const ks = Object.keys(days).sort(); let best = 0, run = 0, prev = null; for (const k of ks) { run = prev && Date.parse(k) - Date.parse(prev) === 864e5 ? run + 1 : 1; best = Math.max(best, run); prev = k; } return best; }
function achList(s) {
  const okR = (x) => x && Array.isArray(x.r) && x.r.every((r) => r && typeof r.m === "number"), D = Object.values(s.days).filter(okR), H = Object.values(s.hdays).filter(okR), all = D.concat(H).flatMap((x) => x.r);
  return [
    ["はじめての配達", "手紙を1回届ける", s.total, 1],
    ["ぴったりの感覚", "今日の3問・上級で、いちばん少ない本数（ヒントなし）を10回", all.filter(one).length, 10],
    ["ぴったり名人", "今日の3問・上級で、いちばん少ない本数（ヒントなし）を50回", all.filter(one).length, 50],
    ["三つともぴったり", "今日の3問を全部いちばん少ない本数で終える", D.filter((x) => x.r.every(one)).length, 1],
    ["ヒントなしの一週間", "ヒントを使わずに今日の3問を終えた日が7日", D.filter((x) => x.r.every((r) => !r.h)).length, 7],
    ["上級に挑む", "上級を終える", H.length, 1],
    ["七本道の名人", "上級の2つともいちばん少ない本数で届ける", H.filter((x) => x.r.length >= 2 && x.r.every(one)).length, 1],
    ["三日つづけて", "3日続けて今日の3問を終える", maxStreak(s.days), 3],
    ["一週間つづけて", "7日続けて今日の3問を終える", maxStreak(s.days), 7],
    ["大通りの達人", "大通り（6本）をいちばん少ない本数で20回（練習も数える）", s.perf[2] || 0, 20],
    ["百通の手紙", "手紙を100回届ける", s.total, 100],
  ].map(([name, desc, cur, goal]) => ({ name, desc, cur: Math.min(cur, goal), goal, done: cur >= goal }));
}
const achDone = (s) => achList(s).filter((a) => a.done).map((a) => a.name);

// ---- 画面 ----
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
const buzz = (n = 12) => { try { navigator.vibrate && navigator.vibrate(n); } catch (e) {} };
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const footer = () => `<footer><a href="#" id="f-how">遊び方</a><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a><a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi で応援</a></footer>`;
function bindFooter() { const h = $("f-how"); if (h) h.onclick = (e) => { e.preventDefault(); openHow(); }; }
function openHow() { $("fb2").href = FEEDBACK; const d = $("howto"); if (d.showModal) d.showModal(); else d.setAttribute("open", ""); }
$("howto-ok").onclick = () => { const d = $("howto"); d.close ? d.close() : d.removeAttribute("open"); save((s) => { s.tut = true; }); };
// ホームの小さなあみだ（飾り）
const DEMO = `<svg viewBox="0 0 200 92" width="200" height="92" aria-hidden="true" style="display:block;margin:0 auto"><g stroke="#26323a" stroke-width="3" stroke-linecap="round">${[30, 80, 130, 180].map((x) => `<line x1="${x}" y1="18" x2="${x}" y2="74"/>`).join("")}<line x1="30" y1="34" x2="80" y2="34"/><line x1="130" y1="44" x2="180" y2="44"/></g><g stroke="#d2492f" stroke-width="4" stroke-linecap="round"><line x1="80" y1="56" x2="130" y2="56"/></g><g font-size="13" font-weight="800" text-anchor="middle" fill="#26323a">${["あ", "い", "う", "え"].map((c, i) => `<text x="${30 + 50 * i}" y="12">${c}</text>`).join("")}${["い", "う", "え", "あ"].map((c, i) => `<text x="${30 + 50 * i}" y="90">🏠</text>`).join("")}</g></svg>`;

function home() {
  const s = load(), k = todayKey(), done = s.days[k], hdone = s.hdays[k];
  for (const m of ["d", "h"]) { const r = s.runs[m]; if (r && r.res.length >= r.list.length) { MODE = m; return finish(); } }
  const nr = nextRank(s.total);
  const rd = s.runs.d && s.runs.d.date === k ? s.runs.d : null, rh = s.runs.h && s.runs.h.date === k ? s.runs.h : null;
  app.innerHTML = `
    <h1 class="title">あみだ配達</h1>
    ${DEMO}

    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：7本の道に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">配達帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home;
  $("go-p").onclick = practiceMenu;
  $("go-dex").onclick = dex;
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  if (mode !== "p") {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
}

// 実績：取れたものと、まだのものの進み具合
function ach() {
  const L = achList(load());
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${L.filter((a) => a.done).length}/${L.length}</small></h1><span></span></header>
    <div class="achs">${L.map((a) => `<div class="${a.done ? "got" : ""}"><b>${a.done ? "★" : "☆"} ${esc(a.name)}</b><small>${esc(a.desc)}</small>${a.done ? "" : `<i style="--p:${Math.round((a.cur / a.goal) * 100)}%"></i><small>${a.cur}/${a.goal}</small>`}</div>`).join("")}</div>
    ${footer()}`;
  $("back").onclick = home;
  bindFooter();
}
// 配達帳：道の数ごとの、届けた数といちばん少ない本数で届けた数
function dex() {
  const s = load();
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>配達帳<small>届けた手紙 ${s.total}通</small></h1><span></span></header>
    <p class="note">道の数ごとに、届けた数と、いちばん少ない本数（ヒントなし）で届けた数です。練習も数えます。</p>
    <div class="res">${LVS.map((L, lv) => { const n = s.cnt[lv] || 0, q = s.perf[lv] || 0; return `<div class="${n ? "" : "no"}"><span>${esc(L.name)}（${L.n}本の道）<br><small style="color:var(--ink2)">ぴったり ${q}回${n ? `（${Math.round((q / n) * 100)}%）` : ""}</small></span><b>${n}通</b></div>`; }).join("")}</div>
    ${footer()}`;
  $("back").onclick = home;
  bindFooter();
}

window.__am = { achList, maxStreak, mode: () => MODE, T, LVS, dailyList, hardList, probOf, starsOf, todayKey, dayNo, shareText, streak, load, valid, cur: () => cur, toggle: (r, g) => toggle(r, g), deliver: () => deliver(), hint: () => hint(), play: (m) => { if (m) MODE = m; play(); } };
home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
